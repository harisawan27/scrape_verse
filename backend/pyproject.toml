[project]
name = "web-radar-backend"
version = "0.1.0"
description = "Persistent product-price monitoring API for Web Radar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "postgres: requires RUN_POSTGRES_INTEGRATION=1 and a disposable PostgreSQL database",
  "bright_data: opt-in live Bright Data Scraper Studio API validation tests",
]

