name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'database/**'
      - 'app.py'
      - 'requirements.txt'
      - 'README.md'
      - '.github/workflows/deploy-backend.yml'


  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Sync & Deploy to Hugging Face Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade huggingface_hub

      - name: Resolve Hugging Face Authentication
        id: auth
        env:
          HF_TOKEN_SECRET: ${{ secrets.HF_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN_SECRET" ]; then
            echo "Using HF_TOKEN secret from GitHub Secrets."
            echo "HF_TOKEN=$HF_TOKEN_SECRET" >> $GITHUB_ENV
          else
            echo "HF_TOKEN secret not found. Attempting OIDC token exchange..."
            if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
              GH_RES=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://huggingface.co" || true)
              
              GH_JWT=$(echo "$GH_RES" | jq -r '.value // empty' 2>/dev/null || true)
              
              if [ -n "$GH_JWT" ]; then
                HF_RES=$(curl -s -X POST "https://huggingface.co/api/oidc/token" \
                  -H "Content-Type: application/json" \
                  -d "{\"token\": \"$GH_JWT\"}" || true)
                
                HF_TOKEN_VAL=$(echo "$HF_RES" | jq -r '.token // empty' 2>/dev/null || true)
                if [ -n "$HF_TOKEN_VAL" ]; then
                  echo "Successfully authenticated via Hugging Face OIDC."
                  echo "HF_TOKEN=$HF_TOKEN_VAL" >> $GITHUB_ENV
                  exit 0
                fi
              fi
            fi

            echo "::error::No valid authentication token found."
            echo "Please create a Write token on Hugging Face (https://huggingface.co/settings/tokens) and add it as a secret named HF_TOKEN in GitHub (Repo Settings -> Secrets and variables -> Actions -> New repository secret)."
            exit 1
          fi

      - name: Push to Hugging Face Space
        env:
          HF_SPACE: ${{ vars.HF_SPACE || secrets.HF_SPACE }}
        run: |
          TARGET_SPACE="${HF_SPACE}"
          if [ -z "$TARGET_SPACE" ]; then
            echo "::error::HF_SPACE variable or secret is not defined."
            echo "Please set HF_SPACE in your GitHub Repo Settings -> Secrets and variables -> Actions -> Variables."
            echo "Example: HF_SPACE = harisawan27/web-radar-api"
            exit 1
          fi

          echo "Configuring Git for Hugging Face Space: $TARGET_SPACE"
          git config --global user.email "bot@webradar.io"
          git config --global user.name "Web Radar CI"

          git remote add hf "https://user:$HF_TOKEN@huggingface.co/spaces/$TARGET_SPACE" || true
          git remote set-url hf "https://user:$HF_TOKEN@huggingface.co/spaces/$TARGET_SPACE"
          
          echo "Pushing code to Hugging Face Space..."
          git push -f hf main:main
          echo "Successfully synced repository with Hugging Face Space!"
